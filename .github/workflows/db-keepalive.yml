name: Database Keep Alive

on:
  schedule:
    # GitHub Actions only guarantees scheduled workflows on the default branch.
    # A 5-minute interval keeps the service active without creating many jobs.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send MySQL heartbeat
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python -m pip install --disable-pip-version-check --no-input "PyMySQL>=1.1,<2"
          python - <<'PY'
          import os
          import time

          import pymysql

          required = ("DB_HOST", "DB_PORT", "DB_USER", "DB_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError("Missing GitHub secrets: " + ", ".join(missing))

          connection_args = {
              "host": os.environ["DB_HOST"],
              "port": int(os.environ["DB_PORT"]),
              "user": os.environ["DB_USER"],
              "password": os.environ["DB_PASSWORD"],
              "connect_timeout": 15,
              "read_timeout": 15,
              "write_timeout": 15,
              # Request TLS. Aiven's MySQL service accepts TLS connections;
              # ssl={} enables encryption without certificate verification.
              "ssl": {},
          }
          if os.environ.get("DB_NAME"):
              connection_args["database"] = os.environ["DB_NAME"]

          last_error = None
          for attempt in range(1, 4):
              conn = None
              try:
                  conn = pymysql.connect(**connection_args)
                  with conn.cursor() as cursor:
                      cursor.execute("SELECT 1")
                      result = cursor.fetchone()
                  print(f"Database heartbeat succeeded: {result}")
                  break
              except Exception as error:
                  last_error = error
                  print(f"Heartbeat attempt {attempt}/3 failed: {error}")
                  if attempt < 3:
                      time.sleep(5)
              finally:
                  if conn is not None:
                      conn.close()
          else:
              raise last_error
          PY
